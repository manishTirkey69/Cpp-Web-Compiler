services:

  # ── Backend: Node.js + TypeScript + g++ ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpp-shell-backend
    restart: unless-stopped
    ports:
      - "3001:3001"       # Expose for local debugging; nginx proxies internally
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - backend_temp:/app/temp   # Persist temp compile artifacts across restarts
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend: Vite build → nginx ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpp-shell-frontend
    restart: unless-stopped
    ports:
      - "8080:80"         # Visit http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_temp:
